upstream api {
    server api1:3000 max_fails=2 fail_timeout=5s;
    server api2:3000 max_fails=2 fail_timeout=5s;
    server api3:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;   # reuse connections to the APIs instead of opening one per request
}

log_format upstream '$remote_addr -> $upstream_addr "$request" $status $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;          # keepalive to the upstream needs HTTP/1.1
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: a client cannot fake its IP by sending its own header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

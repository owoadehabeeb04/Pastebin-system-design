name: pastebin

x-api: &api
  image: pastebin-api
  build: .
  environment:
    DATABASE_URL: postgres://pastebin:pastebin@postgres:5432/pastebin
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://s3:8333
    S3_BUCKET: pastebin
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    CACHE_ENABLED: ${CACHE_ENABLED:-true}
    RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-10}
    PUBLIC_BASE_URL: http://localhost:8080
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    s3: { condition: service_started }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: pastebin
      POSTGRES_DB: pastebin
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastebin"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3 stand-in. SeaweedFS instead of MinIO: MinIO's public Docker images were removed.
  # Same S3 API, so the app code does not care.
  s3:
    image: chrislusf/seaweedfs:3.99
    command: server -s3 -dir=/data
    ports: ["9000:8333"]
    volumes: [s3data:/data]

  migrate:
    image: pastebin-api
    build: .
    command: node dist/migrate.js
    environment:
      DATABASE_URL: postgres://pastebin:pastebin@postgres:5432/pastebin
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api1: *api
  api2: *api
  api3: *api

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api1, api2, api3]
    restart: unless-stopped

volumes:
  pgdata:
  s3data:

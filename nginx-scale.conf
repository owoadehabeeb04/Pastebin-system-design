upstream api {
    server api1:3000 max_fails=2 fail_timeout=5s;
    server api2:3000 max_fails=2 fail_timeout=5s;
    server api3:3000 max_fails=2 fail_timeout=5s;
    server api4:3000 max_fails=2 fail_timeout=5s;
    server api5:3000 max_fails=2 fail_timeout=5s;
    server api6:3000 max_fails=2 fail_timeout=5s;
    server api7:3000 max_fails=2 fail_timeout=5s;
    server api8:3000 max_fails=2 fail_timeout=5s;
    server api9:3000 max_fails=2 fail_timeout=5s;
    server api10:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

log_format upstream '$remote_addr -> $upstream_addr "$request" $status $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
